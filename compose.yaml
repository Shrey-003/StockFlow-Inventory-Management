
name: stockflow

# Shared configuration for backend processes.
x-backend-environment: &backend-environment
  APP_ENV: "${APP_ENV:?APP_ENV is required}"

  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME:?DB_NAME is required}"

  CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"

  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
  WORKER_API_TOKEN: "${WORKER_API_TOKEN:?WORKER_API_TOKEN is required}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"

  LOGIN_RATE_LIMIT_SECRET: "${LOGIN_RATE_LIMIT_SECRET:?LOGIN_RATE_LIMIT_SECRET is required}"
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: "${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}"
  LOGIN_RATE_LIMIT_IP_USERNAME_MAX_ATTEMPTS: "${LOGIN_RATE_LIMIT_IP_USERNAME_MAX_ATTEMPTS:-10}"
  LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS: "${LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS:-60}"

  EXPIRY_WORKER_API_URL: "http://api:8000"
  EXPIRY_WORKER_INTERVAL_SECONDS: "${EXPIRY_WORKER_INTERVAL_SECONDS:-30}"
  EXPIRY_WORKER_REQUEST_TIMEOUT_SECONDS: "${EXPIRY_WORKER_REQUEST_TIMEOUT_SECONDS:-10}"
  EXPIRY_WORKER_MAX_BACKOFF_SECONDS: "${EXPIRY_WORKER_MAX_BACKOFF_SECONDS:-300}"

services:

  # PostgreSQL database
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"

      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}"
      MIGRATOR_DB_PASSWORD: "${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD is required}"


    volumes:
      - stockflow_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped
    stop_grace_period: 1m

    networks:
      - database_internal

  # One-time database migration service
  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["alembic", "upgrade", "head"]

    environment:
      <<: *backend-environment
      DB_USER: stockflow_migrator
      DB_PASSWORD: "${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD is required}"

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

    networks:
      - database_internal

  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      <<: *backend-environment
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped
    stop_grace_period: 30s

    networks:
      - edge
      - database_internal
      - worker_internal

  # Reservation expiry background worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["python", "expiry_worker.py"]

    environment:
      WORKER_API_TOKEN: "${WORKER_API_TOKEN:?WORKER_API_TOKEN is required}"
      EXPIRY_WORKER_API_URL: "${EXPIRY_WORKER_API_URL:-http://api:8000}"
      EXPIRY_WORKER_INTERVAL_SECONDS: "${EXPIRY_WORKER_INTERVAL_SECONDS:-30}"
      EXPIRY_WORKER_REQUEST_TIMEOUT_SECONDS: "${EXPIRY_WORKER_REQUEST_TIMEOUT_SECONDS:-10}"
      EXPIRY_WORKER_MAX_BACKOFF_SECONDS: "${EXPIRY_WORKER_MAX_BACKOFF_SECONDS:-300}"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
    stop_grace_period: 30s

    healthcheck:
      disable: true

    networks:
      - worker_internal

  # Angular frontend and Nginx reverse proxy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    ports:
      - "127.0.0.1:8081:80"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - edge

# Persistent PostgreSQL storage
volumes:
  stockflow_postgres_data:
    name: stockflow_postgres_data

# Network isolation
networks:
  edge:
    driver: bridge

  database_internal:
    driver: bridge
    internal: true

  worker_internal:
    driver: bridge
    internal: true
